[workspace]
members = [
    "crates/mediaforge-types",
    "crates/mediaforge-core",
    "crates/mediaforge-config",
    "crates/mediaforge-storage",
    "crates/mediaforge-manifest",
    "crates/mediaforge-tasks",
    "crates/mediaforge-links",
    "crates/mediaforge-ingest",
    "crates/mediaforge-image",
    "crates/mediaforge-video",
    "crates/mediaforge-observability",
    "crates/mediaforge-api",
    "crates/mediaforge-worker",
    "crates/mediaforge-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/mediaforge"
rust-version = "1.81"

[workspace.dependencies]
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = true }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
