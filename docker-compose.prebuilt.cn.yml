services:
  mediaforge:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt.cn
      args:
        DEBIAN_IMAGE: ${MEDIAFORGE_DEBIAN_IMAGE:-m.daocloud.io/docker.io/library/debian:bookworm-slim}
        DEBIAN_MIRROR: ${MEDIAFORGE_DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${MEDIAFORGE_DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
    image: ${MEDIAFORGE_IMAGE:-mediaforge:prebuilt-cn}
    restart: unless-stopped
    env_file:
      - ${MEDIAFORGE_ENV_FILE:-.env.example}
    environment:
      MEDIAFORGE_HTTP_BIND: 0.0.0.0:8080
      MEDIAFORGE_TEMP_DIR: /tmp/mediaforge
      MEDIAFORGE_FFMPEG_PATH: ffmpeg
      MEDIAFORGE_FFPROBE_PATH: ffprobe
      MEDIAFORGE_FFMPEG_THREADS: ${MEDIAFORGE_FFMPEG_THREADS:-1}
      MEDIAFORGE_WORKER_CONCURRENCY: ${MEDIAFORGE_WORKER_CONCURRENCY:-1}
    ports:
      - "${MEDIAFORGE_PORT:-8080}:8080"
    volumes:
      - mediaforge-temp:/tmp/mediaforge
      - mediaforge-object-store:/var/lib/mediaforge/object-store

volumes:
  mediaforge-temp:
  mediaforge-object-store:

